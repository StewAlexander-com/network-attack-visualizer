<path d="M370 120L240 230" fill="none" stroke="#354953" stroke-width="2" data-source="gateway" data-target="router"/>
<path d="M240 230L240 418" fill="none" stroke="#354953" stroke-width="2" data-source="router" data-target="switch"/>
