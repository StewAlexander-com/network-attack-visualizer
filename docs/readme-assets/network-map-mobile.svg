<path d="M240 230L390 330" fill="none" stroke="#354953" stroke-width="2" data-source="router" data-target="server-b"/>
<path d="M240 418L82 542" fill="none" stroke="#354953" stroke-width="2" data-source="switch" data-target="ws-a"/>
