<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="title desc">
<title id="title">One network, nine devices</title><desc id="desc">Physical links: Internet to Gateway; Gateway to Core Router; Core Router to L2 Switch, Web Server and DB Server; L2 Switch to WS-A, WS-B, Attacker and Web Server. Device layout is illustrative.</desc>
