<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-labelledby="title desc">
<title id="title">Choose, observe, explain, defend</title><desc id="desc">Four steps: choose a scenario, observe packet direction, explain what changed and why, then compare detection and defensive controls.</desc>
<rect width="480" height="560" rx="16" fill="#131e26"/>
<text x="28" y="38" fill="#d9bd8e" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1">FROM A MOVING PACKET TO A USEFUL QUESTION</text>
<text x="28" y="98" fill="#d9bd8e" font-family="Arial, Helvetica, sans-serif" font-size="16" >01</text>
<text x="76" y="100" fill="#f7f3e9" font-family="Georgia, Times New Roman, serif" font-size="32" >Choose</text>
<text x="76" y="135" fill="#bfccd3" font-family="Arial, Helvetica, sans-serif" font-size="19" >Pick a scenario.</text>
<path d="M38 116L38 163" fill="none" stroke="#b9dcd6" stroke-width="2" />
<path d="M32 156l6 7 6-7" fill="none" stroke="#b9dcd6" stroke-width="2"/>
<text x="28" y="216" fill="#d9bd8e" font-family="Arial, Helvetica, sans-serif" font-size="16" >02</text>
<text x="76" y="218" fill="#f7f3e9" font-family="Georgia, Times New Roman, serif" font-size="32" >Observe</text>
<text x="76" y="253" fill="#bfccd3" font-family="Arial, Helvetica, sans-serif" font-size="19" >Follow packet direction.</text>
<path d="M38 234L38 281" fill="none" stroke="#b9dcd6" stroke-width="2" />
<path d="M32 274l6 7 6-7" fill="none" stroke="#b9dcd6" stroke-width="2"/>
<text x="28" y="334" fill="#d9bd8e" font-family="Arial, Helvetica, sans-serif" font-size="16" >03</text>
<text x="76" y="336" fill="#f7f3e9" font-family="Georgia, Times New Roman, serif" font-size="32" >Explain</text>
<text x="76" y="371" fill="#bfccd3" font-family="Arial, Helvetica, sans-serif" font-size="19" >What changed, and why?</text>
<path d="M38 352L38 399" fill="none" stroke="#b9dcd6" stroke-width="2" />
<path d="M32 392l6 7 6-7" fill="none" stroke="#b9dcd6" stroke-width="2"/>
<text x="28" y="452" fill="#d9bd8e" font-family="Arial, Helvetica, sans-serif" font-size="16" >04</text>
<text x="76" y="454" fill="#f7f3e9" font-family="Georgia, Times New Roman, serif" font-size="32" >Defend</text>
<text x="76" y="489" fill="#bfccd3" font-family="Arial, Helvetica, sans-serif" font-size="19" >Compare detection and controls.</text>
</svg>
